title: "UI/UX polish: unlock progress + visuals"
summary: >
  Live unlock progress feedback: the badge and the clean-mode overlay show
  the current ⌘ n/6 count as the user presses Command, resetting when the
  rolling 10-second window expires. Visual polish: fade-in on arm and
  fade-out before close (0.15s) for the badge and every overlay window,
  and a refined overlay typography hierarchy (bold title, subtitle,
  progress line). Badge uses the ⌘ glyph in its baseline label.
