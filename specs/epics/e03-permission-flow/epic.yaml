id: e03
slug: permission-flow
title: "Accessibility permission flow"
summary: >
  CGEventTap requires the Accessibility permission. This epic makes first-run
  painless: detect missing permission, prompt via AXIsProcessTrustedWithOptions,
  open the System Settings pane, and exit with a documented error code when the
  user declines. Never fail silently.
