id: e01
slug: input-lock
title: "CAT MODE: input lock core"
summary: >
  laplap cat consumes every keyboard, trackpad, and mouse event via a single
  CGEventTap at kCGHIDEventTap. The unlock gesture (CMD pressed 6 times within
  a rolling 10-second window) is detected inside the tap callback before events
  are consumed. A small corner badge shows the lock is armed. Process death
  restores input — no cleanup required.
status: merged
